profile=gpu-hq
hwdec=auto-copy
hwdec-codecs=all
hr-seek-framedrop=no
no-resume-playback
osd-bar=no
border=no
alang = 'jpn,jp,eng,en'
slang = 'eng,en,enUS' # enUS for Crunchyroll.
dither-depth=auto
volume=100 # Set volume to 90% on startup.
volume-max=200 # Set player max vol to 200%.
scale=ewa_lanczossharp
dscale=mitchell
cscale=spline36 # alternatively ewa_lanczossoft depending on preference
ytdl-format=bestvideo[height<=?1440]+bestaudio/best # Set max streaming quality as 1440p.
demuxer-max-bytes=150000000 # Max pre-load for network streams (1 MiB = 1048576 Bytes).
demuxer-max-back-bytes=75000000 # Max loaded video kept after playback.
force-seekable=yes
demuxer-mkv-subtitle-preroll=yes
sub-auto=fuzzy
keep-open=yes
fullscreen=yes


# Optimized shaders for higher-end GPU: Mode A (HQ)
glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"
