# -*- conf -*-

# For documentation on these options, see `man fnott.ini`

# Global values
# output=<undefined>#
# min-width=0
# max-width=0
# max-height=0
# stacking-order=bottom-up
# anchor=top-right
# edge-margin-vertical=10
# edge-margin-horizontal=10
# notification-margin=10
# icon-theme=hicolor
# max-icon-size=32
# selection-helper=dmenu
# selection-helper-uses-null-separator=no
# play-sound=aplay ${filename}

# Default values, may be overridden in 'urgency' specific sections
# layer=top

background=1a1b26ff

border-color=7aa2f7ff
# border-radius=0
# border-size=1

# padding-vertical=20
# padding-horizontal=20

# dpi-aware=no

title-font=Geist:size=11
title-color=a9b1d6ff
title-format=<i>%a%A</i>

summary-font=Geist:size=11
summary-color=c0caf5ff
summary-format=<b>%s</b>\n

body-font=Geist:size=11
body-color=c0caf5ff
body-format=%b

# progress-bar-height=20
progress-color=565f89ff
# progress-style=bar

# sound-file=
# icon=

# Timeout values are in seconds. 0 to disable
max-timeout=10
default-timeout=3
# idle-timeout=0

# [low]
# background=2b2b2bff
# title-color=888888ff
# summary-color=888888ff
# body-color=888888ff

# [normal]

[critical]
border-color=f7768eff
